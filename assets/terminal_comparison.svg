<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="100%" height="auto" role="img" aria-label="Terminal comparison: without Preflight the agent's code crashes with an ImportError; with Preflight the claim is verified live and the agent self-corrects" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <pattern id="term-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#111827" stroke-width="0.5"/>
    </pattern>
  </defs>

  <rect width="1200" height="520" rx="10" fill="#070A10" stroke="#263449" stroke-width="1.5"/>
  <rect width="1200" height="520" rx="10" fill="url(#term-grid)" opacity="0.5"/>

  <!-- ==================== LEFT WINDOW: WITHOUT PREFLIGHT ==================== -->
  <g transform="translate(35, 30)">
    <rect width="550" height="460" rx="7" fill="#0C1019" stroke="#334155" stroke-width="1"/>

    <path d="M 0 7 C 0 3.13 3.13 0 7 0 L 543 0 C 546.87 0 550 3.13 550 7 L 550 36 L 0 36 Z" fill="#161F2E"/>
    <line x1="0" y1="36" x2="550" y2="36" stroke="#334155" stroke-width="1"/>

    <circle cx="18" cy="18" r="5" fill="#EF4444"/>
    <circle cx="34" cy="18" r="5" fill="#F5A623"/>
    <circle cx="50" cy="18" r="5" fill="#10B981"/>

    <text x="70" y="22" fill="#8B98AE" font-family="ui-monospace, 'SF Mono', 'Cascadia Code', monospace" font-size="11.5" font-weight="600">agent_session.py — without Preflight</text>

    <rect x="424" y="8" width="112" height="20" rx="4" fill="#3B0A0A" stroke="#DC2626" stroke-width="1"/>
    <text x="480" y="22" fill="#FCA5A5" font-family="ui-monospace, 'SF Mono', 'Cascadia Code', monospace" font-size="10.5" font-weight="700" text-anchor="middle">&#215; BUILD CRASH</text>

    <g transform="translate(18, 56)" font-family="ui-monospace, 'SF Mono', 'Cascadia Code', monospace" font-size="11.5">
      <text x="0" y="16" fill="#5B6B84"># Agent writes code from a stale training cutoff:</text>
      <text x="0" y="40" fill="#F43F5E" font-weight="600">from pydantic import BaseSettings</text>
      <text x="0" y="60" fill="#DDE4EE">class AppConfig(BaseSettings):</text>
      <text x="0" y="78" fill="#C3CCDA">    database_url: str</text>
      <text x="0" y="102" fill="#DDE4EE">config = AppConfig()</text>

      <line x1="0" y1="124" x2="512" y2="124" stroke="#1E293B" stroke-width="1"/>
      <text x="0" y="146" fill="#8B98AE">$ python app.py</text>

      <rect x="0" y="160" width="512" height="210" rx="5" fill="#160A0D" stroke="#7F1D1D" stroke-width="1"/>
      <g transform="translate(14, 178)">
        <text x="0" y="14" fill="#F87171" font-weight="700">Traceback (most recent call last):</text>
        <text x="0" y="36" fill="#FCA5A5">  File "app.py", line 1, in &lt;module&gt;</text>
        <text x="0" y="58" fill="#F87171">    from pydantic import BaseSettings</text>
        <text x="0" y="86" fill="#EF4444" font-weight="700">ImportError: cannot import name 'BaseSettings'</text>
        <text x="0" y="106" fill="#EF4444" font-weight="700">from 'pydantic'</text>
        <text x="0" y="134" fill="#8B98AE">Cause: BaseSettings moved to pydantic-settings</text>
        <text x="0" y="152" fill="#8B98AE">in the Pydantic v2 core overhaul.</text>
        <text x="0" y="178" fill="#F87171" font-weight="700">[Process exited with code 1]</text>
      </g>
    </g>
  </g>

  <!-- ==================== RIGHT WINDOW: WITH PREFLIGHT ==================== -->
  <g transform="translate(615, 30)">
    <rect width="550" height="460" rx="7" fill="#0C1019" stroke="#059669" stroke-width="1.2"/>

    <path d="M 0 7 C 0 3.13 3.13 0 7 0 L 543 0 C 546.87 0 550 3.13 550 7 L 550 36 L 0 36 Z" fill="#0D251C"/>
    <line x1="0" y1="36" x2="550" y2="36" stroke="#059669" stroke-width="1"/>

    <circle cx="18" cy="18" r="5" fill="#EF4444"/>
    <circle cx="34" cy="18" r="5" fill="#F5A623"/>
    <circle cx="50" cy="18" r="5" fill="#10B981"/>

    <text x="70" y="22" fill="#A7F3D0" font-family="ui-monospace, 'SF Mono', 'Cascadia Code', monospace" font-size="11.5" font-weight="600">agent_session.py — Preflight intercept</text>

    <rect x="384" y="8" width="152" height="20" rx="4" fill="#0A2A20" stroke="#10B981" stroke-width="1"/>
    <text x="460" y="22" fill="#6EE7B7" font-family="ui-monospace, 'SF Mono', 'Cascadia Code', monospace" font-size="10.5" font-weight="700" text-anchor="middle">&#x2713; CLEAN EXECUTION</text>

    <g transform="translate(18, 56)" font-family="ui-monospace, 'SF Mono', 'Cascadia Code', monospace" font-size="11.5">
      <rect x="0" y="0" width="512" height="116" rx="5" fill="#081C15" stroke="#047857" stroke-width="1"/>
      <g transform="translate(12, 18)">
        <text x="0" y="10" fill="#34D399" font-weight="700">INFO preflight.server: verifying claim (BaseSettings)</text>
        <text x="0" y="30" fill="#6EE7B7">INFO search_client: 3 vectors -&gt; SerpApi live search</text>
        <text x="0" y="50" fill="#FBBF24" font-weight="700">VERDICT: OUTDATED (98% confidence) · verified in 3ms</text>
        <text x="0" y="70" fill="#8B98AE">canonical: pypi.org/project/pydantic-settings</text>
        <text x="0" y="90" fill="#38BDF8">fix: from pydantic_settings import BaseSettings</text>
      </g>

      <line x1="0" y1="132" x2="512" y2="132" stroke="#1E293B" stroke-width="1"/>
      <text x="0" y="152" fill="#5B6B84"># Agent applies the grounded correction:</text>
      <text x="0" y="174" fill="#34D399" font-weight="600">from pydantic_settings import BaseSettings  # fixed</text>
      <text x="0" y="194" fill="#DDE4EE">class AppConfig(BaseSettings):</text>
      <text x="0" y="212" fill="#C3CCDA">    database_url: str</text>
      <text x="0" y="236" fill="#DDE4EE">config = AppConfig()</text>

      <line x1="0" y1="256" x2="512" y2="256" stroke="#1E293B" stroke-width="1"/>
      <text x="0" y="278" fill="#8B98AE">$ python app.py</text>

      <rect x="0" y="292" width="512" height="66" rx="5" fill="#052E29" stroke="#0D9488" stroke-width="1"/>
      <g transform="translate(14, 312)">
        <text x="0" y="10" fill="#5EEAD4" font-weight="600">AppConfig loaded: database_url set</text>
        <text x="0" y="32" fill="#34D399" font-weight="700">&#x2713; Process finished — exit code 0 (3ms)</text>
      </g>
    </g>
  </g>
</svg>
