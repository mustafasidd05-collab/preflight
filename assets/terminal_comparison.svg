<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560">
  <defs>
    <pattern id="term-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#141C2E" stroke-width="0.6"/>
    </pattern>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="560" rx="8" fill="#070A10" stroke="#1E293B" stroke-width="1.5"/>
  <rect width="1200" height="560" rx="8" fill="url(#term-grid)" opacity="0.6"/>

  <!-- ==================== LEFT WINDOW: WITHOUT PREFLIGHT ==================== -->
  <g transform="translate(35, 30)">
    <!-- Terminal Outer Frame -->
    <rect width="550" height="500" rx="6" fill="#0C1019" stroke="#334155" stroke-width="1.2"/>
    
    <!-- Titlebar Header -->
    <path d="M 0 6 C 0 2.68 2.68 0 6 0 L 544 0 C 547.32 0 550 2.68 550 6 L 550 38 L 0 38 Z" fill="#172033"/>
    <line x1="0" y1="38" x2="550" y2="38" stroke="#334155" stroke-width="1"/>
    
    <!-- macOS Traffic Light Dots -->
    <circle cx="20" cy="19" r="5.5" fill="#EF4444"/>
    <circle cx="38" cy="19" r="5.5" fill="#F59E0B"/>
    <circle cx="56" cy="19" r="5.5" fill="#10B981"/>
    
    <!-- Window Title -->
    <text x="78" y="24" fill="#94A3B8" font-family="ui-monospace, 'SF Mono', monospace" font-size="13" font-weight="600">agent_session.py &#8212; Without Preflight</text>
    
    <!-- Status Badge: CRASH -->
    <rect x="415" y="8" width="120" height="22" rx="4" fill="#450A0A" stroke="#DC2626" stroke-width="1"/>
    <text x="475" y="23" fill="#FCA5A5" font-family="ui-monospace, 'SF Mono', monospace" font-size="11.5" font-weight="700" text-anchor="middle">&#215; BUILD CRASH</text>
    
    <!-- Terminal Body -->
    <g transform="translate(24, 56)" font-family="ui-monospace, 'SF Mono', 'Cascadia Code', monospace" xml:space="preserve">
      <!-- Comment -->
      <text x="0" y="18" fill="#64748B" font-size="12.5"># Agent writes code using stale training cutoff:</text>
      
      <!-- Deprecated Code -->
      <text x="0" y="42" fill="#F43F5E" font-size="14" font-weight="700">from pydantic import BaseSettings</text>
      <text x="0" y="66" fill="#E2E8F0" font-size="13.5">class AppConfig(BaseSettings):</text>
      <text x="0" y="88" fill="#CBD5E1" font-size="13.5">    database_url: str</text>
      <text x="0" y="112" fill="#E2E8F0" font-size="13.5">config = AppConfig()</text>
      
      <!-- Command Execution -->
      <line x1="0" y1="132" x2="502" y2="132" stroke="#1E293B" stroke-width="1"/>
      <text x="0" y="156" fill="#94A3B8" font-size="13.5">$ python app.py</text>
      
      <!-- Verbatim Crash Output Box -->
      <rect x="0" y="174" width="502" height="222" rx="5" fill="#180B0F" stroke="#7F1D1D" stroke-width="1.2"/>
      <text x="14" y="200" fill="#F87171" font-size="13" font-weight="700">Traceback (most recent call last):</text>
      <text x="14" y="222" fill="#FCA5A5" font-size="12.5">  File "app.py", line 1, in &lt;module&gt;</text>
      <text x="14" y="242" fill="#F87171" font-size="12.5">    from pydantic import BaseSettings</text>
      <text x="14" y="270" fill="#EF4444" font-size="14" font-weight="700">ImportError: cannot import name 'BaseSettings'</text>
      <text x="14" y="292" fill="#EF4444" font-size="14" font-weight="700">from 'pydantic'</text>
      <text x="14" y="320" fill="#94A3B8" font-size="12.5">Cause: BaseSettings was moved to pydantic-settings</text>
      <text x="14" y="340" fill="#94A3B8" font-size="12.5">in Pydantic v2 core overhaul.</text>
      <text x="14" y="372" fill="#F87171" font-size="13.5" font-weight="700">[Process exited with code 1]</text>
    </g>
  </g>

  <!-- ==================== RIGHT WINDOW: WITH PREFLIGHT ==================== -->
  <g transform="translate(615, 30)">
    <!-- Terminal Outer Frame -->
    <rect width="550" height="500" rx="6" fill="#0C1019" stroke="#059669" stroke-width="1.4"/>
    
    <!-- Titlebar Header -->
    <path d="M 0 6 C 0 2.68 2.68 0 6 0 L 544 0 C 547.32 0 550 2.68 550 6 L 550 38 L 0 38 Z" fill="#0D281E"/>
    <line x1="0" y1="38" x2="550" y2="38" stroke="#059669" stroke-width="1"/>
    
    <!-- macOS Traffic Light Dots -->
    <circle cx="20" cy="19" r="5.5" fill="#EF4444"/>
    <circle cx="38" cy="19" r="5.5" fill="#F59E0B"/>
    <circle cx="56" cy="19" r="5.5" fill="#10B981"/>
    
    <!-- Window Title -->
    <text x="78" y="24" fill="#A7F3D0" font-family="ui-monospace, 'SF Mono', monospace" font-size="13" font-weight="600">agent_session.py &#8212; Preflight Intercept</text>
    
    <!-- Status Badge: VERIFIED -->
    <rect x="375" y="8" width="160" height="22" rx="4" fill="#064E3B" stroke="#10B981" stroke-width="1"/>
    <text x="455" y="23" fill="#6EE7B7" font-family="ui-monospace, 'SF Mono', monospace" font-size="11.5" font-weight="700" text-anchor="middle">&#x2713; CLEAN EXECUTION</text>
    
    <!-- Terminal Body -->
    <g transform="translate(24, 56)" font-family="ui-monospace, 'SF Mono', 'Cascadia Code', monospace" xml:space="preserve">
      <!-- Verbatim Intercept Box -->
      <rect x="0" y="0" width="502" height="136" rx="5" fill="#0A1E17" stroke="#047857" stroke-width="1.2"/>
      <text x="14" y="24" fill="#34D399" font-size="12.5" font-weight="700">INFO:preflight: [INTERCEPT] 'In Pydantic v2...'</text>
      <text x="14" y="46" fill="#6EE7B7" font-size="12">INFO:search_client: 3 vectors &#8594; SerpApi Google Search</text>
      <text x="14" y="70" fill="#FBBF24" font-size="13" font-weight="700">VERDICT: OUTDATED (98% conf) &#8226; Verified in 3ms</text>
      <text x="14" y="92" fill="#94A3B8" font-size="11.5">Canonical: https://pypi.org/project/pydantic-settings/</text>
      <text x="14" y="116" fill="#38BDF8" font-size="13" font-weight="700">Fix: from pydantic_settings import BaseSettings</text>
      
      <!-- Divider -->
      <line x1="0" y1="150" x2="502" y2="150" stroke="#1E293B" stroke-width="1"/>
      <text x="0" y="172" fill="#64748B" font-size="12.5"># Agent automatically applies grounded correction:</text>
      
      <!-- Corrected Code -->
      <text x="0" y="196" fill="#34D399" font-size="14" font-weight="700">from pydantic_settings import BaseSettings  # Fixed</text>
      <text x="0" y="220" fill="#E2E8F0" font-size="13.5">class AppConfig(BaseSettings):</text>
      <text x="0" y="242" fill="#CBD5E1" font-size="13.5">    database_url: str</text>
      <text x="0" y="266" fill="#E2E8F0" font-size="13.5">config = AppConfig()</text>
      
      <!-- Command Execution -->
      <line x1="0" y1="284" x2="502" y2="284" stroke="#1E293B" stroke-width="1"/>
      <text x="0" y="308" fill="#94A3B8" font-size="13.5">$ python app.py</text>
      
      <!-- Success Box -->
      <rect x="0" y="324" width="502" height="72" rx="5" fill="#042F2E" stroke="#0D9488" stroke-width="1.2"/>
      <text x="14" y="348" fill="#5EEAD4" font-size="12.5" font-weight="600">AppConfig loaded successfully: database_url='...'</text>
      <text x="14" y="372" fill="#34D399" font-size="13.5" font-weight="700">&#x2713; [Process finished with exit code 0 (verified in 3ms)]</text>
    </g>
  </g>
</svg>
