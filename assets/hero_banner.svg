<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300">
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#161F2E" stroke-width="0.6"/>
    </pattern>
  </defs>

  <!-- Canvas: deep indigo-navy, not pure black -->
  <rect width="1200" height="300" rx="10" fill="#0B1120" stroke="#263449" stroke-width="1.5"/>
  <rect x="1.5" y="1.5" width="1197" height="297" rx="9" fill="url(#grid)" opacity="0.5"/>

  <!-- Top accent hairline (SerpApi amber, functional brand tie) -->
  <rect x="1.5" y="1.5" width="1197" height="3" rx="1.5" fill="#F5A623"/>

  <!-- ============ LEFT ZONE: brand + copy ============ -->
  <g transform="translate(56, 46)">
    <circle cx="6" cy="6" r="4.5" fill="#34D399"/>
    <text x="18" y="10" fill="#8B98AE" font-family="ui-monospace, 'SF Mono', 'Cascadia Code', monospace" font-size="11.5" font-weight="600" letter-spacing="0.06em">MODEL CONTEXT PROTOCOL · SERPAPI ENGINE</text>
  </g>

  <text x="56" y="118" fill="#F3F6FA" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="54" font-weight="800" letter-spacing="-0.03em">Preflight</text>

  <text x="56" y="156" fill="#DCE3EC" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="600" letter-spacing="-0.01em">Verifies an AI coding agent's claims before it writes the code</text>

  <text x="56" y="186" fill="#8B98AE" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14.5" font-weight="400">Live SerpApi search, ranked by source trust, checked against the claim in real time</text>

  <!-- CLI one-liner, grounded and real -->
  <g transform="translate(56, 214)">
    <rect width="470" height="34" rx="5" fill="#0F1626" stroke="#263449" stroke-width="1"/>
    <text x="14" y="22" fill="#6EE7B7" font-family="ui-monospace, 'SF Mono', 'Cascadia Code', monospace" font-size="12.5">$ preflight init --client claude-code</text>
  </g>

  <!-- ============ DIVIDER: ticket perforation ============ -->
  <g>
    <circle cx="716" cy="0" r="10" fill="#070A10"/>
    <circle cx="716" cy="300" r="10" fill="#070A10"/>
    <line x1="716" y1="20" x2="716" y2="280" stroke="#263449" stroke-width="1.5" stroke-dasharray="5 6"/>
  </g>

  <!-- ============ RIGHT ZONE: pre-flight checklist stub ============ -->
  <g transform="translate(752, 44)">
    <text x="0" y="0" fill="#8B98AE" font-family="ui-monospace, 'SF Mono', 'Cascadia Code', monospace" font-size="11.5" font-weight="600" letter-spacing="0.08em">PRE-FLIGHT CHECKLIST</text>

    <g transform="translate(0, 26)" font-family="ui-monospace, 'SF Mono', 'Cascadia Code', monospace" font-size="14.5">
      <!-- item 1 -->
      <circle cx="7" cy="4" r="7" fill="#0F291F" stroke="#34D399" stroke-width="1.2"/>
      <path d="M 3.5 4 L 6 6.5 L 10.5 1.5" fill="none" stroke="#34D399" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="24" y="8" fill="#E2E8F0">Python 3.10+</text>

      <!-- item 2 -->
      <circle cx="7" cy="40" r="7" fill="#0F291F" stroke="#34D399" stroke-width="1.2"/>
      <path d="M 3.5 40 L 6 42.5 L 10.5 37.5" fill="none" stroke="#34D399" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="24" y="44" fill="#E2E8F0">FastMCP · stdio transport</text>

      <!-- item 3 -->
      <circle cx="7" cy="76" r="7" fill="#0F291F" stroke="#34D399" stroke-width="1.2"/>
      <path d="M 3.5 76 L 6 78.5 L 10.5 73.5" fill="none" stroke="#34D399" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="24" y="80" fill="#E2E8F0">33 / 33 tests passing</text>

      <!-- item 4 -->
      <circle cx="7" cy="112" r="7" fill="#0F291F" stroke="#34D399" stroke-width="1.2"/>
      <path d="M 3.5 112 L 6 114.5 L 10.5 109.5" fill="none" stroke="#34D399" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="24" y="116" fill="#E2E8F0">MIT licensed</text>
    </g>

    <!-- footer stamp -->
    <g transform="translate(0, 196)">
      <line x1="0" y1="0" x2="412" y2="0" stroke="#263449" stroke-width="1"/>
      <circle cx="7" cy="20" r="4" fill="#F5A623"/>
      <text x="20" y="24" fill="#B9C2D0" font-family="ui-monospace, 'SF Mono', 'Cascadia Code', monospace" font-size="12" font-weight="600">Powered by SerpApi live search</text>
    </g>
  </g>
</svg>
