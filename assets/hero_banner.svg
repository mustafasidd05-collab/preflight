<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" height="auto">
  <defs>
    <!-- Clean geometric micro-grid pattern for developer-infrastructure aesthetic -->
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#161F30" stroke-width="0.8"/>
    </pattern>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="300" rx="8" fill="#0B0F17" stroke="#1E293B" stroke-width="1.5"/>
  <rect width="1200" height="300" rx="8" fill="url(#grid)" opacity="0.85"/>

  <!-- Top Accent Line (SerpApi Amber Gold) -->
  <rect x="0" y="0" width="1200" height="3" fill="#F59E0B"/>

  <!-- Brand Lockup -->
  <!-- Status Indicator: Live MCP Guardrail -->
  <g transform="translate(60, 48)">
    <circle cx="6" cy="6" r="4.5" fill="#10B981"/>
    <text x="18" y="10" fill="#94A3B8" font-family="ui-monospace, 'SF Mono', 'Segoe UI Mono', monospace" font-size="12" font-weight="600" letter-spacing="0.08em">MODEL CONTEXT PROTOCOL &#8226; SERPAPI ENGINE</text>
  </g>

  <!-- Project Name -->
  <text x="60" y="112" fill="#F8FAFC" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="800" letter-spacing="-0.03em">PREFLIGHT</text>

  <!-- Primary Tagline -->
  <text x="60" y="152" fill="#E2E8F0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="600" letter-spacing="-0.01em">FastMCP Verification Engine for AI Coding Agents</text>

  <!-- Subtitle -->
  <text x="60" y="184" fill="#94A3B8" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="400">Grounded Real-Time API Guardrails Powered by SerpApi Live Search</text>

  <!-- Divider Line -->
  <line x1="60" y1="216" x2="1140" y2="216" stroke="#1E293B" stroke-width="1"/>

  <!-- Static Verified Badges (All facts verified & true) -->
  <g transform="translate(60, 236)">
    <!-- Badge 1: Python 3.10+ -->
    <rect x="0" y="0" width="120" height="28" rx="4" fill="#064E3B" stroke="#059669" stroke-width="1"/>
    <text x="60" y="18" fill="#A7F3D0" font-family="ui-monospace, 'SF Mono', monospace" font-size="12" font-weight="600" text-anchor="middle">Python 3.10+</text>

    <!-- Badge 2: FastMCP stdio -->
    <rect x="132" y="0" width="135" height="28" rx="4" fill="#3B0764" stroke="#7C3AED" stroke-width="1"/>
    <text x="199" y="18" fill="#DDD6FE" font-family="ui-monospace, 'SF Mono', monospace" font-size="12" font-weight="600" text-anchor="middle">FastMCP stdio</text>

    <!-- Badge 3: 33/33 Tests Passing (Static verified count) -->
    <rect x="279" y="0" width="168" height="28" rx="4" fill="#064E3B" stroke="#059669" stroke-width="1"/>
    <text x="363" y="18" fill="#A7F3D0" font-family="ui-monospace, 'SF Mono', monospace" font-size="12" font-weight="600" text-anchor="middle">&#x2713; 33/33 Tests Passing</text>

    <!-- Badge 4: MIT License -->
    <rect x="459" y="0" width="110" height="28" rx="4" fill="#082F49" stroke="#0284C7" stroke-width="1"/>
    <text x="514" y="18" fill="#BAE6FD" font-family="ui-monospace, 'SF Mono', monospace" font-size="12" font-weight="600" text-anchor="middle">MIT License</text>

    <!-- Badge 5: Powered by SerpApi -->
    <rect x="581" y="0" width="164" height="28" rx="4" fill="#451A03" stroke="#D97706" stroke-width="1"/>
    <circle cx="597" cy="14" r="4" fill="#F59E0B"/>
    <text x="674" y="18" fill="#FDE68A" font-family="ui-monospace, 'SF Mono', monospace" font-size="12" font-weight="600" text-anchor="middle">Powered by SerpApi</text>
  </g>
</svg>
